      subMaxLevel: 3,

  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script>
    // Collapsible sidebar functionality
    (function() {
      const expandedLinks = new Set();
      let isSettingUpSidebar = false;
      let setupTimer = 0;

      function directChild(item, tagName) {
        tagName = tagName.toUpperCase();
        return Array.prototype.find.call(item.children, function(child) {
          return child.tagName === tagName;
        });
      }

      function itemDepth(item) {
        let depth = 0;
        let parent = item.parentElement;
        while (parent) {
          const parentItem = parent.parentElement && parent.parentElement.closest('li');
          if (!parentItem) break;
          depth += 1;
          parent = parentItem.parentElement;
        }
        return depth;
      }

      function itemKey(item, link) {
        return link && link.getAttribute('href') || link && link.textContent.trim() || item.textContent.trim();
      }
      
      function setupCollapsible() {
        if (isSettingUpSidebar) return;
        isSettingUpSidebar = true;

        const sidebar = document.querySelector('.sidebar');
        if (!sidebar) {
          isSettingUpSidebar = false;
          return;
        }
        
        const items = sidebar.querySelectorAll('ul li');
        items.forEach(function(item) {
          let sublist = directChild(item, 'ul');
          let adjacentSublist = false;
          const next = item.nextElementSibling;
          if (!sublist && next && next.tagName === 'UL') {
            sublist = next;
            adjacentSublist = true;
            item.classList.add('section-parent');
          } else {
            item.classList.remove('section-parent');
          }

          if (sublist) {
            item.classList.add('has-children');
            
            const link = directChild(item, 'a');
            if (link) {
              const key = itemKey(item, link);
              const hasActiveChild = sublist.querySelector('li.active') !== null;
              const depth = itemDepth(item);
              const shouldExpand = expandedLinks.has(key) || item.classList.contains('active') || hasActiveChild || (!adjacentSublist && depth === 0);
              
              if (shouldExpand) {
                item.classList.remove('collapsed');
              } else {
                item.classList.add('collapsed');
              }

              let toggle = directChild(item, 'button');
              if (!toggle || !toggle.classList.contains('nav-branch-toggle')) {
                toggle = document.createElement('button');
                toggle.type = 'button';
                toggle.className = 'nav-branch-toggle';
                link.insertAdjacentElement('afterend', toggle);
              }

              toggle.setAttribute('aria-label', item.classList.contains('collapsed') ? 'Expand section' : 'Collapse section');
              toggle.setAttribute('aria-expanded', item.classList.contains('collapsed') ? 'false' : 'true');
              toggle.textContent = item.classList.contains('collapsed') ? '›' : '⌄';

              toggle.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();

                const collapsed = item.classList.toggle('collapsed');
                toggle.setAttribute('aria-label', collapsed ? 'Expand section' : 'Collapse section');
                toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggle.textContent = collapsed ? '›' : '⌄';

                if (collapsed) {
                  expandedLinks.delete(key);
                } else {
                  expandedLinks.add(key);
                }
              };
            }
          }
        });

        isSettingUpSidebar = false;
      }

      function scheduleSetup() {
        window.clearTimeout(setupTimer);
        setupTimer = window.setTimeout(setupCollapsible, 50);
      }
      
      // Initialize
      function init() {
        scheduleSetup();
      }
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
      
      // Re-setup only on actual navigation
      if (window.$docsify) {
        window.$docsify.plugins = [].concat(window.$docsify.plugins || [], function(hook) {
          hook.doneEach(function() {
            scheduleSetup();
          });
        });
      }
    })();
  </script>
