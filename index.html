  <script>
    // Collapsible sidebar functionality
    (function() {
      // Use link hrefs as keys for persistence across re-renders
      const expandedLinks = new Set();
      
      function setupCollapsible() {
        const sidebar = document.querySelector('.sidebar');
        if (!sidebar) return;
        
        const items = sidebar.querySelectorAll('ul li');
        items.forEach(function(item) {
          const sublist = item.querySelector('ul');
          if (sublist) {
            item.classList.add('has-children');
            
            const link = item.querySelector('a');
            if (link) {
              const linkHref = link.getAttribute('href');
              // Only expand if user manually expanded it OR if this item or its children are active
              const hasActiveChild = item.querySelector('li.active') !== null;
              const shouldExpand = (linkHref && expandedLinks.has(linkHref)) || item.classList.contains('active') || hasActiveChild;
              
              if (shouldExpand) {
                item.classList.remove('collapsed');
              } else {
                item.classList.add('collapsed');
              }
              
              // Remove old listeners and add new one
              const newLink = link.cloneNode(true);
              link.parentNode.replaceChild(newLink, link);
              
              newLink.addEventListener('click', function(e) {
                if (item.classList.contains('has-children')) {
                  const href = newLink.getAttribute('href');
                  
                  if (item.classList.contains('collapsed')) {
                    e.preventDefault();
                    e.stopPropagation();
                    item.classList.remove('collapsed');
                    if (href) expandedLinks.add(href);
                  } else {
                    if (!item.classList.contains('active')) {
                      e.preventDefault();
                      e.stopPropagation();
                      item.classList.add('collapsed');
                      if (href) expandedLinks.delete(href);
                    }
                  }
                }
              });
            }
          }
        });
      }
      
      // Initialize
      function init() {
        setupCollapsible();
        
        // Watch for sidebar changes and preserve state
        const observer = new MutationObserver(function() {
          const sidebar = document.querySelector('.sidebar');
          if (sidebar) {
            const items = sidebar.querySelectorAll('ul li.has-children');
            items.forEach(function(item) {
              const link = item.querySelector('a');
              if (link) {
                const href = link.getAttribute('href');
                const hasActiveChild = item.querySelector('li.active') !== null;
                const shouldExpand = (href && expandedLinks.has(href)) || item.classList.contains('active') || hasActiveChild;
                
                if (shouldExpand) {
                  item.classList.remove('collapsed');
                } else {
                  item.classList.add('collapsed');
                }
              }
            });
          }
        });
        
        const sidebar = document.querySelector('.sidebar');
        if (sidebar) {
          observer.observe(sidebar, { childList: true, subtree: true });
        }
      }
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
      
      // Re-setup only on actual navigation
      if (window.$docsify) {
        window.$docsify.plugins = [].concat(window.$docsify.plugins || [], function(hook) {
          hook.doneEach(function() {
            setTimeout(setupCollapsible, 50);
          });
        });
      }
    })();
  </script>
</body>
